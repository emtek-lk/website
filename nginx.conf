# Send www.emtek.lk to the apex (mirrors public/_redirects)
server {
    listen 80;
    server_name www.emtek.lk;
    return 301 https://emtek.lk$request_uri;
}

server {
    listen 80 default_server;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    absolute_redirect off;

    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_types text/plain text/css application/javascript application/json application/manifest+json image/svg+xml application/xml;

    include /etc/nginx/snippets/security-headers.conf;

    # Redirect /about/ -> /about (trailingSlash: 'never')
    rewrite ^/(.+)/$ /$1 permanent;

    # Clean URLs: /about serves about.html (build.format = 'file')
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri $uri.html $uri/index.html =404;
    }

    # Hashed build assets can be cached forever. ^~ stops the image rule below from taking over.
    location ^~ /_astro/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Unhashed PNGs in /public (favicons, og-image): one day
    location ~* \.png$ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=86400";
        try_files $uri =404;
    }

    # nginx's mime.types has no entry for the web manifest
    location = /site.webmanifest {
        include /etc/nginx/snippets/security-headers.conf;
        default_type application/manifest+json;
    }

    error_page 404 /404.html;
}
